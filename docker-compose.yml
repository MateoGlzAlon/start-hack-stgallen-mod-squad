# Backend now; the frontend joins via the "ui" profile (the Makefile enables it once frontend/Dockerfile exists).
# State (policies.json) lives in the `store` volume - `make deprovision` wipes it.
services:
  backend:
    build: ./backend
    container_name: leash-backend
    environment:
      VISECA_BASE_URL: ${VISECA_BASE_URL:-https://saw26api.ashyground-364e1d07.switzerlandnorth.azurecontainerapps.io}
      TEAM_API_KEY: ${TEAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-30000}
      JUDGE_TIMEOUT_MS: ${JUDGE_TIMEOUT_MS:-15000}
      STORE_DIR: /store
      DATA_DIR: /data
      FX_RATES_FILE: ${FX_RATES_FILE:-}
    volumes:
      - ./resources/viseca-2026-main/data:/data:ro
      - store:/store
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Local model for `make provision_local`: an OpenAI-compatible API on ollama:11434 (no key needed) that replaces the OpenAI API.
  # Claude models cannot run locally, so this serves an open model chosen with LOCAL_MODEL.
  ollama:
    profiles: ["local"]
    image: ollama/ollama:latest
    container_name: leash-ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"        # keep the model in memory between requests
    volumes:
      - ollama:/root/.ollama         # downloaded models
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    # GPU (needs the NVIDIA container toolkit): uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend:
    profiles: ["ui"]
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    container_name: leash-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  store:
  ollama:
