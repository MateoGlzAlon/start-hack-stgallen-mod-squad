# Backend now; the frontend joins via the "ui" profile (the Makefile enables it once frontend/Dockerfile exists).
# State (policies.json) lives in the `store` volume - `make deprovision` wipes it (and the `llm-models` model volume), `make deprovision_no_volumes` wipes only the policies and keeps the model (no new download).
services:
  backend:
    build: ./backend
    container_name: leash-backend
    environment:
      VISECA_BASE_URL: ${VISECA_BASE_URL:-https://saw26api.ashyground-364e1d07.switzerlandnorth.azurecontainerapps.io}
      TEAM_API_KEY: ${TEAM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1}
      COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-30000}
      JUDGE_TIMEOUT_MS: ${JUDGE_TIMEOUT_MS:-15000}
      STORE_DIR: /store
      DATA_DIR: /data
      FX_RATES_FILE: ${FX_RATES_FILE:-}
    volumes:
      - ./resources/viseca-2026-main/data:/data:ro
      - store:/store
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Local model for `make provision_local`: llama.cpp's llama-server, an OpenAI-compatible API on llm:8080 (no key needed) that replaces the OpenAI API.
  # It downloads the GGUF from Hugging Face itself (LOCAL_MODEL = <user>/<repo>[:quant]) into the llm-models volume, so only the first start is slow.
  # Claude models cannot run locally, so this serves an open model. (Ollama was tried first: 0.34.2 refuses Hugging Face downloads, ollama/ollama#18526.)
  llm:
    profiles: ["local"]
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: leash-llm
    command:
      - --hf-repo
      - ${LOCAL_MODEL:-unsloth/Apertus-8B-Instruct-2509-GGUF:Q4_K_M}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "16384"                      # split over the slots below: 8192 tokens per request
      - --parallel
      - "2"
    environment:
      LLAMA_CACHE: /models
    volumes:
      - llm-models:/models           # downloaded models
    healthcheck:                     # 503 while the model loads; the first start also downloads it (about 5 GB), hence the long allowance
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 1440
      start_period: 30s
    # GPU (needs the NVIDIA container toolkit): use the ghcr.io/ggml-org/llama.cpp:server-cuda image, add "--n-gpu-layers", "99" to the command and uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  frontend:
    profiles: ["ui"]
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    container_name: leash-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  store:
  llm-models:
