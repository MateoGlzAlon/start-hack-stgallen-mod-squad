spring.application.name=leash-backend
server.port=8080

# Also read the repo's .env when running outside Docker (IntelliJ, mvnw): working dir is backend/ or the repo root.
# Real environment variables still win (that is how docker compose passes them).
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# All env-driven; every key is optional (no key = feature off, engine still answers deterministically)
leash.viseca.base-url=${VISECA_BASE_URL:https://saw26api.ashyground-364e1d07.switzerlandnorth.azurecontainerapps.io}
leash.viseca.api-key=${TEAM_API_KEY:}
leash.viseca.worker-enabled=${WORKER_ENABLED:true}

leash.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
leash.openai.api-key=${OPENAI_API_KEY:}
leash.openai.model=${OPENAI_MODEL:gpt-4.1}
leash.openai.compile-timeout-ms=${COMPILE_TIMEOUT_MS:30000}
leash.openai.judge-timeout-ms=${JUDGE_TIMEOUT_MS:5000}

# Where our own state (policies.json) lives; DATA_DIR is the read-only Viseca data pack (history CSV)
leash.store-dir=${STORE_DIR:store}
leash.data-dir=${DATA_DIR:../resources/viseca-2026-main/data}

management.endpoints.web.exposure.include=health

# Swagger UI: /swagger-ui.html   OpenAPI JSON: /v3/api-docs
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=list
springdoc.default-produces-media-type=application/json
